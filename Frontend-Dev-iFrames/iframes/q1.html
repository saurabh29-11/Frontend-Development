<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive YouTube Video</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #111;
    }

    /* Container maintains aspect ratio */
    .video-container {
      position: relative;
      width: 80%;      /* 80% of the browser width */
      height: 45%;     /* 45% of the browser height */
      max-width: 100%;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <iframe 
      src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
      title="YouTube video"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
