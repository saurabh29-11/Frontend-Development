<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embedded Google Map</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f3f3f3;
    }

    iframe {
      border: 0;
      width: 80%;   /* 80% of the browser width */
      height: 70%;  /* 70% of the browser height */
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <!-- 
    The 'loading="lazy"' attribute delays loading of the iframe 
    until it becomes visible on the screen. 
    This helps improve page loading speed and performance. 
  -->
  <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7002.525812905763!2d77.210276!3d28.613939!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390cfd50e62e43bf%3A0x7e0a4a1cbb4b16b!2sNew%20Delhi%2C%20Delhi!5e0!3m2!1sen!2sin!4v1697890000000"
    title="Map of New Delhi"
    loading="lazy"
    allowfullscreen>
  </iframe>
</body>
</html>
