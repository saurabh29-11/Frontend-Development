<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Layout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1>My Dashboard</h1>
  </header>

  <!-- Layout Wrapper -->
  <div class="layout">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="#">🏠 Home</a></li>
          <li><a href="#">📊 Analytics</a></li>
          <li><a href="#">⚙️ Settings</a></li>
          <li><a href="#">📩 Messages</a></li>
          <li><a href="#">🚪 Logout</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="content-box">
        <h2>Overview</h2>
        <p>This section gives a quick summary of the dashboard data.</p>
      </div>

      <div class="content-box">
        <h2>Recent Activity</h2>
        <p>Here you can see recent updates, notifications, or user actions.</p>
      </div>
    </main>
  </div>

</body>
</html>
